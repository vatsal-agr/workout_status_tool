[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "workout-status-tool"
version = "0.1.0"
description = "Headless Telemetry Pipeline & LLM Coaching Engine (Caliber + Garmin + Gemini)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.5.0",
    "gspread>=5.12.0",
    "google-auth>=2.25.0",
    "pynacl>=1.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.12.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
