name: Daily Telemetry & Coaching Sync

on:
  schedule:
    # 05:15 UTC = 10:45 AM IST (Daily)
    - cron: '19 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    name: Run Caliber & Garmin Daily Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Print Commit Info
        run: git log -1 --format="Running commit %h - %s"

      - name: Execute Daily Sync & Secret Rotation
        env:
          CALIBER_REFRESH_TOKEN: ${{ secrets.CALIBER_REFRESH_TOKEN }}
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          LOG_LEVEL: INFO
        run: |
          python -m src.pipeline
